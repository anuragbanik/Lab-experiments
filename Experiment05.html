<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 5</title>
</head>
<body>
    <form action="">
        <center>
        <legend><h1>Student Registration Form</h1></legend>
        </center>
        <hr>

        <label for="name">Full Name: </label>
        <input type="text" name="name" id="name" minlength="5" maxlength="15" placeholder="Enter your name"><br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter your email"><br><br>

        <label for="Pass">Password :</label>
        <input
          type="password"
          name="password"
          id="Pass"
          placeholder="Enter your password"
        /><br /><br />

        <label for="gender">Enter your Gender :</label>
        <input type="radio" name="Gender" id="gender" />
        <label for="gender">Male</label>
        <input type="radio" name="Gender" id="gender" />
        <label for="gender">Female</label>
        <input type="radio" name="Gender" id="gender" />
        <label for="gender">Other</label><br /><br />

        <label for="course">Course:</label>
        <select name="course" id="course">
            <option value="">Select</option>
            <option value="B.tech">Bachelor of Technology</option>
            <option value="B.des">Bachelor of Design</option>
            <option value="MBA">Master of Business Administration</option>
        </select><br><br>

        <label for="Phone">Contact number:</label>
        <input type="tel" name="Phone" id="Phone" maxlength="10" placeholder="Enter your phone number"><br><br>

        <label for="Address">Address:</label><br>
        <textarea name="Address" id="Address" placeholder="Enter your address"></textarea><br><br>

        <input type="button" value="Register" />&emsp;
        <input type="button" value="Clear" />

    </form>

    <hr>

    <center>
        <p>&copy; 2023 Student Registration Form</p>
    </center>
</body>
</html>
